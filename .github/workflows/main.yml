name: Crypto Scanner 3-Stage

on:
  repository_dispatch:
    types: [start_scan]
  workflow_dispatch:

jobs:
  scan-crypto:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: 🐍 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 📦 Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests ccxt pandas pytz jdatetime numpy tqdm python-telegram-bot

    - name: 🔍 Run Scanner
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        DEBUG_MODE: "false"
      run: python Trigger.py

    - name: ✅ Job Complete
      if: always()
      run: echo "Scan completed at $(date)"
